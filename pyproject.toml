[project]
name = "mlops-lab-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "joseph.yaghi2@net.usj.edu.lb" }
]
requires-python = ">=3.10"
dependencies = [
    "dvc>=3.67.1",
    "dvc-http>=2.32.0",
    "fastapi>=0.141.1",
    "mlflow>=3.16.0",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.7.2",
    "torch",
    "torchvision",
    "uvicorn>=0.53.0",
]

[project.scripts]
mlops-lab-1 = "mlops_lab_1:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cuda", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cuda", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]